name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *" # hourly: picks up new Substack posts and Gumroad products
  workflow_dispatch: # "Run workflow" button for instant updates

permissions:
  contents: write # to save new posts back into data/
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run sync
      # Keep a copy of new posts in the repo. This also counts as activity, so
      # GitHub never pauses the hourly schedule for an inactive repo.
      - name: Save new posts
        run: |
          if ! git diff --quiet data; then
            git config user.name "artdiscipline-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Sync new posts from Substack"
            git push
          fi
      - run: npm run build
        env:
          # Empty on a custom domain; "/<repo>" on the free github.io address.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
