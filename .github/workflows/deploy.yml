name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *" # daily: picks up new Substack posts and Gumroad products
  workflow_dispatch: # "Run workflow" button for instant updates

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run sync
      - run: npm run build
        env:
          # Empty on a custom domain; "/<repo>" on the free github.io address.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
